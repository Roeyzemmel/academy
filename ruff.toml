# Correctness-only lint (CI: .github/workflows/tests.yml, job `lint`). No style or
# formatting rules; line length is deliberately not enforced (no E501).
target-version = "py310"
extend-exclude = [".claude", "docs", "academy/docs", "evals", "scientist/scripts/legacy", "__pycache__",
                  # a lab template with {{package}} placeholders, not valid Python
                  "scientist/templates/lab/experiments/_template.py"]

[lint]
select = ["F", "E9", "PLE", "B006", "B008", "B018", "B023"]

[lint.per-file-ignores]
# Byte-identical vendored copies; kept in step by academy/tests/test_vendored.py.
"academy/lib/academy_common/*.py" = ["F", "E9", "PLE", "B"]
"**/scripts/_academy/*.py" = ["F", "E9", "PLE", "B"]
