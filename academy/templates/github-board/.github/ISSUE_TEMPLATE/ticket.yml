name: Ticket
description: File a ticket for one academy instance (a collaborator's way in; tools use the same fields)
title: "T-XXXX: "
labels: ["status:open"]
body:
  - type: markdown
    attributes:
      value: "A maintainer's automation renames the title to `T-NNNN: ...` and adds the labels. Fill the fields; do not add status labels yourself."
  - type: dropdown
    id: to
    attributes:
      label: To (instance)
      options: [expert@ts, researcher@flat, researcher@slope1, scientist@ts, author@bi, human]
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [verify, cite, lookup, prove, research, question, experiment, test, code, decision, note, other]
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [normal, high, low]
    validations: {required: true}
  - type: textarea
    id: ask
    attributes:
      label: Ask
    validations: {required: true}
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
    validations: {required: true}
  - type: input
    id: refs
    attributes:
      label: Refs (registry ids, T-/P- ids, bib keys)
